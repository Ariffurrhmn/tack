<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Tack: sticky notes that stay where you stick them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="pin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <g transform="translate(820 40) rotate(5 100 110)">
      <rect width="200" height="200" rx="6" fill="#a7f3d0"/>
      <rect x="24" y="60" width="120" height="8" rx="4" fill="#065f46" opacity="0.35"/>
      <rect x="24" y="84" width="150" height="8" rx="4" fill="#065f46" opacity="0.35"/>
      <rect x="24" y="108" width="90" height="8" rx="4" fill="#065f46" opacity="0.35"/>
      <circle cx="100" cy="22" r="11" fill="url(#pin)"/>
    </g>
    <g transform="translate(980 70) rotate(-6 80 80)">
      <rect width="160" height="160" rx="6" fill="#fde68a"/>
      <rect x="20" y="52" width="100" height="8" rx="4" fill="#92400e" opacity="0.35"/>
      <rect x="20" y="74" width="120" height="8" rx="4" fill="#92400e" opacity="0.35"/>
      <circle cx="80" cy="20" r="10" fill="url(#pin)"/>
    </g>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="165" font-size="96" font-weight="700" fill="#fef3c7">Tack</text>
    <circle cx="368" cy="108" r="12" fill="url(#pin)"/>
    <text x="84" y="214" font-size="28" fill="#d1d5db">Sticky notes that stay where you stick them.</text>
    <text x="84" y="256" font-size="18" fill="#9ca3af">Rust · SQLite · custom windows · Unicode &amp; RTL first</text>
  </g>
</svg>
